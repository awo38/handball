<style>
:root{
  --bg:#f2f2f7;--card:#fff;--card2:#f2f2f7;--label:#000;--sec:rgba(60,60,67,.6);--ter:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.16);--fill:rgba(118,118,128,.12);--bar:rgba(249,249,249,.82);
  --accent:#007aff;--green:#34c759;--red:#ff3b30;--orange:#ff9500;--gray:#8e8e93;
  --r:16px;--shadow:0 1px 0 rgba(0,0,0,.02);
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#000;--card:#1c1c1e;--card2:#2c2c2e;--label:#fff;--sec:rgba(235,235,245,.6);--ter:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.55);--fill:rgba(118,118,128,.24);--bar:rgba(22,22,24,.8);
  --green:#30d158;--red:#ff453a;--orange:#ff9f0a;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--label)}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Inter,system-ui,sans-serif;
  font-size:17px;line-height:1.3;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:var(--accent);text-decoration:none}
.num{font-variant-numeric:tabular-nums}

/* nav bar */
.nav{position:sticky;top:0;z-index:20;padding-top:var(--safe-t);background:transparent;transition:background .2s,border-color .2s;border-bottom:.5px solid transparent}
.nav.scrolled{background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom-color:var(--sep)}
.nav-in{max-width:680px;margin:0 auto;height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.nav-title{font-weight:600;font-size:17px;opacity:0;transition:opacity .2s;position:absolute;left:50%;transform:translateX(-50%);max-width:60%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav.scrolled .nav-title{opacity:1}
.icon-btn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--fill);color:var(--accent)}
.icon-btn svg{width:18px;height:18px}
.status{font-size:13px;color:var(--sec);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
.dot.off{background:var(--gray)}

main{max-width:680px;margin:0 auto;padding:0 16px calc(96px + var(--safe-b))}
.large{display:flex;align-items:center;gap:14px;margin:4px 0 18px}
.large h1{font-size:32px;line-height:1.1;font-weight:700;letter-spacing:-.025em;margin:0}
.large p{margin:3px 0 0;color:var(--sec);font-size:15px}
.crest{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px;letter-spacing:-.02em;position:relative}
.crest.sm{width:28px;height:28px;font-size:10.5px}
.crest.lg{width:64px;height:64px;font-size:21px}
.crest sup{font-size:.62em;position:absolute;right:-1px;top:-2px;background:var(--card);color:var(--label);border-radius:8px;padding:0 3px;line-height:1.35;box-shadow:0 0 0 1px var(--sep)}

h2.sec{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:28px 0 10px;display:flex;justify-content:space-between;align-items:baseline}
h2.sec small{font-size:15px;font-weight:400;color:var(--sec)}
.card{background:var(--card);border-radius:var(--r);overflow:hidden}
.pad{padding:16px}
.list .row{display:flex;align-items:center;gap:12px;padding:11px 16px;position:relative;min-height:52px}
.list .row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.list .row.tap:active{background:var(--fill)}
.row .grow{flex:1;min-width:0}
.row .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;color:var(--sec);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:var(--ter);width:8px;flex:none}
.foot{font-size:13px;color:var(--sec);padding:8px 16px 0}

/* segmented */
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;margin:0 0 14px;position:relative}
.seg button{flex:1;font-size:13px;font-weight:500;padding:6px 4px;border-radius:7px;position:relative;z-index:1;transition:color .2s}
.seg button.on{background:var(--card);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);font-weight:600}
@media (prefers-color-scheme:dark){.seg button.on{background:#636366}}

/* pills */
.pill{display:inline-flex;align-items:center;justify-content:center;min-width:58px;padding:5px 9px;border-radius:9px;font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.pill.W{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green)}
.pill.L{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}
.pill.D{background:color-mix(in srgb,var(--orange) 16%,transparent);color:var(--orange)}
.pill.N{background:var(--fill);color:var(--sec);font-weight:500}
.pill.LIVE{background:var(--red);color:#fff}
.form{display:flex;gap:4px}
.form i{width:22px;height:22px;border-radius:6px;font-style:normal;font-size:11px;font-weight:700;display:grid;place-items:center;color:#fff}
.form i.W{background:var(--green)}.form i.L{background:var(--red)}.form i.D{background:var(--orange)}.form i.E{background:var(--fill)}

/* hero */
.hero{padding:18px 16px 16px;text-align:center;position:relative}
.hero .meta{font-size:13px;color:var(--sec);font-weight:500;text-transform:uppercase;letter-spacing:.02em}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:14px 0 10px}
.vs .side{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.vs .name{font-size:14px;font-weight:600;line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.vs .mid{font-size:15px;color:var(--sec);text-align:center;min-width:92px}
.vs .score{font-size:40px;font-weight:700;letter-spacing:-.03em;color:var(--label);font-variant-numeric:tabular-nums;line-height:1}
.vs .big{font-size:24px;font-weight:700;color:var(--label);letter-spacing:-.02em}
.hero .where{font-size:13px;color:var(--sec)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:4px 9px;border-radius:99px}
.tag.live{background:var(--red);color:#fff}
.tag.live::before{content:"";width:7px;height:7px;border-radius:50%;background:#fff;animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.kpi{background:var(--card);border-radius:var(--r);padding:14px 14px 13px}
.kpi .l{font-size:13px;color:var(--sec);font-weight:500}
.kpi .v{font-size:28px;font-weight:700;letter-spacing:-.03em;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:15px;font-weight:600;color:var(--sec);letter-spacing:0}
.kpi .d{font-size:13px;color:var(--sec);margin-top:2px}

/* table */
table.tb{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
.tb th{font-size:12px;font-weight:600;color:var(--sec);text-align:right;padding:10px 6px 8px;text-transform:uppercase;letter-spacing:.02em}
.tb th:first-child,.tb td:first-child{text-align:center;padding-left:12px;width:36px}
.tb th.tn,.tb td.tn{text-align:left}
.tb td{padding:9px 6px;text-align:right;border-top:.5px solid var(--sep)}
.tb td:last-child,.tb th:last-child{padding-right:14px;font-weight:700}
.tb td.tn{max-width:0;width:100%}
.tb td.tn div{display:flex;align-items:center;gap:9px}
.tb td.tn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb tr.me td{background:color-mix(in srgb,var(--accent) 11%,transparent)}
.tb tr.me td.tn span{font-weight:600}
.tb tr.tap{cursor:pointer}
.mute{color:var(--sec)}
@media (max-width:400px){.tb .xs{display:none}}

/* charts */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--sec);font-size:10px;font-family:inherit}
.legend{display:flex;gap:14px;font-size:12px;color:var(--sec);padding:0 16px 12px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);padding-bottom:var(--safe-b)}
.tabbar-in{max-width:680px;margin:0 auto;display:flex}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;font-size:10.5px;font-weight:500;color:var(--gray);position:relative}
.tabbar button svg{width:25px;height:25px}
.tabbar button.on{color:var(--accent)}
.tabbar .badge{position:absolute;top:5px;left:calc(50% + 8px);width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px var(--bar)}

.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:680px;margin:0 auto;background:var(--bg);border-radius:14px 14px 0 0;max-height:92vh;overflow:auto;transform:translateY(105%);transition:transform .38s cubic-bezier(.32,.72,0,1);padding:0 16px calc(24px + var(--safe-b));-webkit-overflow-scrolling:touch}
.sheet.on{transform:none}
.grab{width:36px;height:5px;border-radius:3px;background:var(--ter);margin:7px auto 6px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:4px 0 10px}
.sheet-h b{font-size:17px}
.btn{display:block;width:100%;text-align:center;background:var(--accent);color:#fff;font-weight:600;padding:14px;border-radius:12px;font-size:17px}

.btn:disabled{opacity:.5}
input.field{width:100%;font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;border:0;background:var(--card);color:var(--label);outline:none}

.swatches button{width:30px;height:30px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.swatches button.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px currentColor}
.check{color:var(--accent);font-weight:600}
.danger{color:var(--red)}
.banner{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--sec);background:var(--card);border-radius:12px;padding:10px 12px;margin:0 0 14px}
.banner b{color:var(--label);font-weight:600}
.empty{text-align:center;color:var(--sec);padding:28px 16px;font-size:15px}
.wk{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}

.wk .icon-btn:disabled{opacity:.35}

@keyframes sh{to{background-position:-200% 0}}
.fade{animation:fi .25s ease}
@keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.toast.on{opacity:1;transform:translate(-50%,0)}
.mini{display:flex;justify-content:space-between;font-size:15px;padding:12px 16px}
.mini+.mini{border-top:.5px solid var(--sep)}
.mini span:last-child{color:var(--sec);font-variant-numeric:tabular-nums;text-align:right}
.bar2{height:6px;border-radius:3px;background:var(--fill);overflow:hidden;margin-top:6px;display:flex}
.bar2 i{display:block;height:100%}
.chips{display:flex;gap:8px;align-items:center;margin:0 0 12px;flex-wrap:wrap}
.chip{font-size:14px;font-weight:500;padding:6px 12px;border-radius:99px;background:var(--card);color:var(--label)}
.chip.on{background:var(--accent);color:#fff}

.bignum{font-size:20px;font-weight:700;letter-spacing:-.02em;min-width:34px;text-align:right}
.bignum small{font-size:13px;color:var(--sec);font-weight:600}
.pens{display:flex;align-items:center;gap:6px;font-size:15px}
.card-y,.card-r{display:inline-block;width:10px;height:14px;border-radius:2px;vertical-align:-2px;font-style:normal;font-size:9px;color:#000;text-align:center;line-height:14px;margin-left:3px}

.tb.sq td.tn div{gap:4px}

    const date = parseDate(ds, ts);
    const ff = /\((\d+):(\d+)\)/.exec(com || '');
    let HG = num(hg), GG = num(gg);
    const played = HG != null && GG != null && !live;
    let hpts = null, gpts = null;
    if(played){
      if(ff){ hpts = +ff[1]; gpts = +ff[2]; }
      else { hpts = HG > GG ? 2 : HG < GG ? 0 : 1; gpts = 2 - hpts; }
    }
    const hid = byShort[h] || null, gid = byShort[g] || null;
    return {id, ds, ts, date, hasTime:!!ts, h:hid, g:gid, hn:hid ? full[hid] : h, gn:gid ? full[gid] : g, hs:h, gs:g,
      hg:HG, gg:GG, hh:num(hh), gh:num(gh), venue, town, street:street || '', sgid:sgid && sgid !== '0' ? sgid : null,
      com:com || '', no, live:!!live, played, forfeit:!!ff, hpts, gpts, ref:ref || '', token:token || '', appid:appid || ''};
  }).filter(g => g.date).sort((a, b) => a.date - b.date);
  const score = raw.score.map(s => ({pos:s[0], id:s[1], name:s[2], p:s[3], w:s[4], d:s[5], l:s[6], gf:s[7], ga:s[8], pts:s[9], ptsm:s[10]}));
  return {raw, head:raw.head, teams:raw.teams.map(([id, n]) => ({id, name:n, short:(raw.alias || {})[id] || n})), full, games, score,
    me:c.tId, fetched:raw.fetched, comments:raw.comments || [], byShort, gameById:Object.fromEntries(games.map(g => [g.id, g]))};
}

/* ---------- helpers ---------- */
const WD = ['So','Mo','Di','Mi','Do','Fr','Sa'];
const MON = ['Jan.','Feb.','März','Apr.','Mai','Juni','Juli','Aug.','Sep.','Okt.','Nov.','Dez.'];
const MONL = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const fmtDay = d => `${WD[d.getDay()]}, ${d.getDate()}. ${MON[d.getMonth()]}`;
const fmtTime = g => g.hasTime ? `${String(g.date.getHours()).padStart(2,'0')}:${String(g.date.getMinutes()).padStart(2,'0')}` : 'Zeit offen';
const sameDay = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
function rel(d){
  const now = new Date(); const a = new Date(now.getFullYear(), now.getMonth(), now.getDate()); const b = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const n = Math.round((b - a) / 864e5);
  if(n === 0) return 'Heute'; if(n === 1) return 'Morgen'; if(n === -1) return 'Gestern';
  if(n > 1 && n < 7) return `in ${n} Tagen`; if(n >= 7) return `in ${Math.round(n / 7)} Woche${Math.round(n / 7) > 1 ? 'n' : ''}`;
  return `vor ${-n} Tagen`;
}
function liveish(g){
  if(g.live) return true;
  if(g.played || !g.hasTime) return false;
  const now = Date.now(), t = g.date.getTime();
  return now >= t - 5 * 60e3 && now <= t + 115 * 60e3;
}
function hue(s){ let h = 0; for(const ch of s) h = (h * 31 + ch.charCodeAt(0)) % 360; return h; }
const PREFIX = /^(tv|tsv|sg|hsg|skv|hc|spvgg|sv|tg|tsg|vfl|vfb|tus|sc|fc|jsg|mtv|ksv|thw|djk|asv|phönix|hd|ma|tb|ht|htv|hg|ssv|ssg|ttv|mtg|tgs|esv|psv|bsv|fsv|gsv|post|sf|sportfreunde)$/i;
function crest(id, name, cls = ''){
  const n = name || '';
  const words = n.replace(/[\/\-.]/g, ' ').split(/\s+/).filter(Boolean);
  const num = (/\s(\d)$/.exec(n) || [])[1];
  const main = words.filter(w => !PREFIX.test(w) && !/^\d+$/.test(w));
  let ini = main.length ? main[0].slice(0, 2) : (words[0] || '?').slice(0, 2);
  ini = ini.toUpperCase();
  const isMe = id && D && id === D.me;
  const bg = isMe ? 'var(--accent)' : `hsl(${hue(n)} 42% 48%)`;
  return `<span class="crest ${cls}" style="background:${bg}">${esc(ini)}${num && cls !== 'sm' ? `<sup>${num}</sup>` : ''}</span>`;
}
const myGames = () => D.games.filter(g => g.h === D.me || g.g === D.me);
function resFor(g, id){
  if(!g.played) return null;
  const pts = g.h === id ? g.hpts : g.gpts;
  return pts === 2 ? 'W' : pts === 1 ? 'D' : 'L';
}
const goalsFor = (g, id) => g.h === id ? [g.hg, g.gg] : [g.gg, g.hg];
const opp = (g, id) => g.h === id ? {id:g.g, name:g.gn} : {id:g.h, name:g.hn};
const teamName = id => (D.full[id] || '');

function computeTable(filter = 'all', upto = null){
  const rows = {};
  D.teams.forEach(t => rows[t.id] = {id:t.id, name:t.name, p:0, w:0, d:0, l:0, gf:0, ga:0, pts:0, ptsm:0});
  let gs = D.games.filter(g => g.played && g.h && g.g && (!upto || g.date <= upto));
  const add = (id, gf, ga, pts) => { const r = rows[id]; if(!r) return; r.p++; r.gf += gf; r.ga += ga; r.pts += pts; r.ptsm += 2 - pts; pts === 2 ? r.w++ : pts === 1 ? r.d++ : r.l++; };
  if(filter === 'form'){
    D.teams.forEach(t => {
      gs.filter(g => g.h === t.id || g.g === t.id).slice(-5).forEach(g => {
        const [f, a] = goalsFor(g, t.id); add(t.id, f, a, g.h === t.id ? g.hpts : g.gpts);
      });
    });
  } else {
    gs.forEach(g => {
      if(filter !== 'away') add(g.h, g.hg, g.gg, g.hpts);
      if(filter !== 'home') add(g.g, g.gg, g.hg, g.gpts);
    });
  }
  const arr = Object.values(rows).sort((a, b) => (b.pts - a.pts) || (a.ptsm - b.ptsm) || ((b.gf - b.ga) - (a.gf - a.ga)) || (b.gf - a.gf) || a.name.localeCompare(b.name));
  arr.forEach((r, i) => r.pos = i + 1);
  return arr;
}
function formOf(id, n = 5){
  return D.games.filter(g => g.played && (g.h === id || g.g === id)).slice(-n).map(g => resFor(g, id));
}
const formHTML = (f, n = 5) => `<span class="form">${Array.from({length:n}, (_, i) => { const r = f[f.length - n + i]; return r ? `<i class="${r}">${r === 'W' ? 'S' : r === 'L' ? 'N' : 'U'}</i>` : '<i class="E"></i>'; }).join('')}</span>`;

function gameRow(g, id = D.me, opts = {}){
  const isTeam = id && (g.h === id || g.g === id);

}

      <div class="kpi"><div class="l">Form</div><div style="margin-top:10px">${formHTML(formOf(D.me))}</div><div class="d" style="margin-top:8px">letzte 5 Spiele</div></div>

function heroCard(g, kind){
  const tagHTML = kind === 'live' ? `<span class="tag live">Live</span>` : `<div class="meta">${fmtDay(g.date)} · ${fmtTime(g)}</div>`;
  let mid;

  else if(g.played) mid = g.forfeit ? `<div class="big">Wertung</div><div style="font-size:12px;margin-top:4px">${esc(g.com)}</div>` : `<div class="score">${g.hg}<span class="mute">:</span>${g.gg}</div>${g.hh != null ? `<div style="font-size:12px;margin-top:6px">Halbzeit ${g.hh}:${g.gh}</div>` : ''}`;
  else mid = `<div class="big">${fmtTime(g)}</div><div style="font-size:12px;margin-top:4px">${rel(g.date)}</div>`;
  const r = g.played ? resFor(g, D.me) : null;
  const rl = r ? `<span class="pill ${r}" style="min-width:0;font-size:12px;padding:3px 8px;position:absolute;top:14px;right:14px">${r === 'W' ? 'Sieg' : r === 'L' ? 'Niederlage' : 'Unentschieden'}</span>` : '';

    <div class="where">${esc(g.venue)}${g.town ? ', ' + esc(g.town) : ''}</div></div>`;
}

function viewGames(){

  }</tbody></table>`;
}
function viewTable(){
  let h = segHTML('table', [['all','Gesamt'],['home','Heim'],['away','Auswärts'],['form','Form']]);

  h += `<div class="foot">${esc(note)}${seg.table === 'all' && D.head.upd ? ' ' + esc(D.head.upd) + '.' : ''}</div>`;

  }
  return h;
}

function statsFor(id){
  const gs = D.games.filter(g => g.played && (g.h === id || g.g === id));
  const real = gs.filter(g => !g.forfeit);
  const s = {n:gs.length, w:0, d:0, l:0, gf:0, ga:0, home:{w:0, d:0, l:0, gf:0, ga:0, n:0}, away:{w:0, d:0, l:0, gf:0, ga:0, n:0},
    htLead:0, htLeadWon:0, htBehind:0, htBehindPts:0, best:null, worst:null, streak:'', streakN:0, h1f:0, h1a:0, h2f:0, h2a:0, nh:0};
  gs.forEach(g => {
    const r = resFor(g, id); const k = r === 'W' ? 'w' : r === 'D' ? 'd' : 'l'; s[k]++;
    const side = g.h === id ? s.home : s.away; side[k]++; side.n++;
    if(!g.forfeit){
      const [f, a] = goalsFor(g, id); s.gf += f; s.ga += a; side.gf += f; side.ga += a;
      const diff = f - a;
      if(!s.best || diff > s.best.diff) s.best = {g, diff, f, a};
      if(!s.worst || diff < s.worst.diff) s.worst = {g, diff, f, a};
      if(g.hh != null){
        const [hf, ha] = g.h === id ? [g.hh, g.gh] : [g.gh, g.hh];
        s.h1f += hf; s.h1a += ha; s.h2f += f - hf; s.h2a += a - ha; s.nh++;
        if(hf > ha){ s.htLead++; if(r === 'W') s.htLeadWon++; }
        if(hf < ha){ s.htBehind++; if(r !== 'L') s.htBehindPts++; }
      }
    }
  });
  for(let i = gs.length - 1; i >= 0; i--){ const r = resFor(gs[i], id); if(!s.streak) s.streak = r; if(r === s.streak) s.streakN++; else break; }
  s.real = real.length;
  return s;
}
function viewStats(){
  const id = D.me, s = statsFor(id);
  if(!s.n) return '<div class="card empty">Noch keine gespielten Spiele.</div>';
  const pct = Math.round((s.w + s.d * .5) / s.n * 100);
  const avg = (x, n) => n ? (x / n).toFixed(1).replace('.', ',') : '–';
  const streakTxt = {W:'Siege', L:'Niederlagen', D:'Remis'}[s.streak];

function diffChart(id){
  const gs = D.games.filter(g => g.played && !g.forfeit && (g.h === id || g.g === id));
  const W = 340, H = 170, L = 16, R = 16, T = 18, B = 30;
  const ds = gs.map(g => { const [f, a] = goalsFor(g, id); return {g, d:f - a, f, a}; });

    const lastPlayed = D.games.filter(g => g.played).map(g => weekKey(g.date)).pop();

  }

function buildStats(){

  const P = (tid, p) => { const name = cleanName(p[1]); const k = tid + '|' + name; return players[k] || (players[k] = {key:k, team:tid, name, nr:p[0], gp:0, goals:0, s7a:0, s7g:0, warn:0, two:0, disq:0, log:[]}); };
  if(SRAW.format === 'reports'){
    for(const [gid, r] of Object.entries(SRAW.reports)){
      const g = D.gameById[gid]; if(!g || !g.h || !g.g) continue;
      box[gid] = {h:r.ph, g:r.pg, ev:r.ev || null, spec:r.spec, refs:r.refs || []};
      [[g.h, r.ph, r.oh, 0], [g.g, r.pg, r.og, 1]].forEach(([tid, pl, off, side]) => {
        const t = T(tid); t.gp++; t.hasTo = true;
        pl.forEach(p => { const o = P(tid, p); o.nr = p[0]; o.gp++; o.goals += p[2]; o.s7a += p[3]; o.s7g += p[4]; o.warn += p[5]; o.two += p[6]; o.disq += p[7];
          o.log.push({gid, goals:p[2], s7a:p[3], s7g:p[4], warn:p[5], two:p[6], disq:p[7]});
          t.goals += p[2]; t.s7a += p[3]; t.s7g += p[4]; t.warn += p[5]; t.two += p[6]; t.disq += p[7]; });
        (off || []).forEach(o => { t.warn += o[2]; t.two += o[3]; t.disq += o[4]; });
        t.to += (r.ev || []).filter(e => e[1] === 6 && e[2] === side).length;
      });
    }

    SRAW.players.forEach(p => { const tid = D.byShort[p[0]]; if(!tid) return; const name = cleanName(p[1]); const k = tid + '|' + name;
      players[k] = {key:k, team:tid, name, nr:p[2], gp:p[3], goals:p[4], s7a:p[5], s7g:p[6], warn:p[7], two:p[8], disq:p[9], log:[]}; });
    Object.entries(SRAW.teams || {}).forEach(([sh, a]) => { const tid = D.byShort[sh]; if(tid) teams[tid] = {id:tid, gp:a[0], s7a:a[1], s7g:a[2], warn:a[3], two:a[4], disq:a[5], to:a[6], hasTo:true}; });

function timelineHTML(g, ev){
  const W = 340, H = 150, L = 22, R = 10, T = 12, B = 22;
  let h = 0, a = 0; const pts = [[0, 0]]; let run = {side:null, n:0}, best = {side:null, n:0}; let maxLead = {h:0, g:0};
  ev.filter(e => e[1] === 0 || e[1] === 1).forEach(e => {
    e[2] === 0 ? h++ : a++; pts.push([e[0], h - a]);
    if(run.side === e[2]) run.n++; else run = {side:e[2], n:1};
    if(run.n > best.n) best = {...run};
    maxLead.h = Math.max(maxLead.h, h - a); maxLead.g = Math.max(maxLead.g, a - h);

  const mx = Math.max(3, ...pts.map(p => Math.abs(p[1])));
  const x = t => L + t / end * (W - L - R), y = d => T + (mx - d) / (2 * mx) * (H - T - B);

  const tos = ev.filter(e => e[1] === 6).map(e => `<text x="${x(e[0])}" y="${e[2] === 0 ? T + 8 : H - B - 8}" text-anchor="middle" style="font-size:9px;fill:var(--sec)">T</text>`).join('');
  const meIsHome = g.h === D.me, meIsGuest = g.g === D.me;
  const col = 'var(--accent)';
  const ht = `<line x1="${x(1800)}" x2="${x(1800)}" y1="${T}" y2="${H - B}" stroke="var(--sep)" stroke-dasharray="3 3"/>`;
  const labels = [0, 15, 30, 45, 60].map(m => `<text x="${x(m * 60)}" y="${H - 6}" text-anchor="middle">${m}'</text>`).join('');
  const nm = s => esc(shortName(s === 0 ? g.h : g.g));
  return `<div class="card" style="padding:12px 0 6px;margin-bottom:12px"><div style="display:flex;justify-content:space-between;padding:0 16px 4px;font-size:12px;color:var(--sec)"><span>▲ ${esc(shortName(g.h))} führt</span><span>▼ ${esc(shortName(g.g))} führt</span></div>
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Spielverlauf">${ht}<line x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--sep)"/>
    <text x="${L - 6}" y="${y(mx) + 4}" text-anchor="end">+${mx}</text><text x="${L - 6}" y="${y(-mx) + 4}" text-anchor="end">+${mx}</text>
    <path d="${path}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>${pens}${tos}${labels}</svg>
    <div class="mini" style="padding:8px 16px"><span>Höchste Führung</span><span>▲ +${maxLead.h} &nbsp; ▼ +${maxLead.g}</span></div>
    ${best.n >= 3 ? `<div class="mini" style="padding:8px 16px"><span>Längster Lauf</span><span>${best.n}:0 ${nm(best.side)}</span></div>` : ''}
    <div class="legend" style="padding:6px 16px 6px"><span><i style="background:var(--orange)"></i>Zeitstrafe</span><span><i style="background:var(--red)"></i>Disqualifikation</span><span>T Auszeit</span></div></div>`;
}

let addState = null;
function teamsSheet(){
  const items = cfg.map((c, i) => {
    const nm = c.name || (i === active && D ? D.full[c.tId] : '') || 'Mannschaft ' + c.tId;
    return `<div class="row tap" data-switch="${i}"><span class="crest sm" style="background:${c.color || COLORS[0]}">${esc(nm.replace(/^(\S+\s)?/, '').slice(0, 2))}</span><div class="grow"><div class="t">${esc(nm)}</div><div class="s">${esc(c.league || '')}</div></div>${i === active ? '<span class="check">✓</span>' : ''}</div>`;
  }).join('');
  const c = cfg[active];
  openSheet(`<div class="sheet-h"><b>Mannschaften</b><button class="icon-btn" data-close aria-label="Schließen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div class="card list">${items}</div>
    <h2 class="sec" style="font-size:19px">Farbe</h2>
    <div class="card"><div class="swatches">${COLORS.map(col => `<button data-color="${col}" class="${(c.color || COLORS[0]).toLowerCase() === col.toLowerCase() ? 'on' : ''}" style="background:${col};color:${col}" aria-label="Farbe ${col}"></button>`).join('')}</div></div>
    <h2 class="sec" style="font-size:19px">Mannschaft hinzufügen</h2>
    <div class="foot" style="padding:0 4px 10px">Öffne auf handball4all.de die Liga deiner Mannschaft und kopiere den Link aus der Adresszeile hier hinein.</div>
    <input class="field" id="addUrl" placeholder="https://www.handball4all.de/…#/league?ogId=…" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div id="addRes" style="margin-top:12px"></div>
    <div style="margin-top:12px"><button class="btn" id="addGo">Liga laden</button></div>
    <div style="margin-top:28px;display:grid;gap:10px">
      ${location.protocol.startsWith('http') && !/claude|claudeusercontent/.test(location.host) ? '<button class="btn ghost" data-share>App teilen</button>' : ''}
      <button class="btn ghost" data-refresh>Jetzt aktualisieren</button>
      ${cfg.length > 1 ? `<button class="btn ghost danger" data-remove>„${esc(c.name || 'Mannschaft')}“ entfernen</button>` : ''}
    </div>
    <div class="foot" style="text-align:center;margin-top:16px">Daten: handball4all.de · ${esc(D ? D.head.upd : '')}</div>`);
}
async function addFromUrl(){
  const v = $('#addUrl').value.trim();
  const og = (/ogId=(\d+)/.exec(v) || [])[1], lId = (/lId=(\d+)/.exec(v) || [])[1], tId = (/tId=(\d+)/.exec(v) || [])[1];
  const res = $('#addRes');
  if(!og || !lId){ res.innerHTML = '<div class="banner"><span>ℹ️</span><div>Der Link braucht <b>ogId</b> und <b>lId</b>, z. B. aus der Liga-Ansicht auf handball4all.de.</div></div>'; return; }
  res.innerHTML = '<div class="skel" style="height:60px"></div>';
  try{
    const b = (await getJSON(url({og, lId})))[0];
    const teams = (b.content.teamsList || []).map(t => [String(t.teamID), tr(t.teamName)]);
    addState = {og, lId, league:`${tr(b.head.name)}${b.head.headline1 ? ' · ' + tr(b.head.headline1) : ''}`};
    res.innerHTML = `<div class="foot" style="padding:0 4px 8px">${esc(addState.league)} – wähle deine Mannschaft:</div><div class="card list">${teams.map(([id, n]) => `<div class="row tap" data-pick="${id}" data-name="${esc(n)}">${crest(id, n, 'sm')}<div class="grow t">${esc(n)}</div>${id === tId ? '<span class="check">●</span>' : ''}</div>`).join('')}</div>`;
  }catch(e){
    res.innerHTML = `<div class="banner"><span>⚠️</span><div><b>Konnte die Liga nicht laden.</b><br>${source === 'snapshot' ? 'In dieser Vorschau sind keine Live-Abfragen möglich – öffne die App-Datei direkt.' : 'Prüfe den Link und deine Internetverbindung.'}</div></div>`;
  }
}
function addTeam(o){
  if(cfg.some(c => c.og === o.og && c.lId === o.lId && c.tId === o.tId)){ active = cfg.findIndex(c => c.og === o.og && c.lId === o.lId && c.tId === o.tId); }
  else { cfg.push({...o, color:COLORS[cfg.length % COLORS.length]}); active = cfg.length - 1; }
  store.set('hb.teams', cfg); store.set('hb.active', active);
  closeSheet(); tab = 'home'; D = null; RAW = null; applyColor(); render(); load(true); toast(`${o.name || 'Mannschaft'} hinzugefügt`);
}

/* ---------- load / poll ---------- */
function applyColor(){ document.documentElement.style.setProperty('--accent', cfg[active].color || COLORS[0]); }
async function load(full = true){
  if(loading) return; loading = true;
  const c = cfg[active], k = key(c);
  try{
    const raw = (full || !RAW || RAW.key !== k) ? await fetchFull(c) : await fetchLight(c, RAW);
    RAW = raw; source = 'live'; lastLoad = Date.now();
    store.set('hb.cache.' + k, raw);
  }catch(e){
    if(!RAW || RAW.key !== k){
      const cached = store.get('hb.cache.' + k, null);
      if(cached){ RAW = cached; source = 'cache'; }
      else if(SNAPSHOT && SNAPSHOT.key === k){ RAW = SNAPSHOT; source = 'snapshot'; }
    } else if(source === 'live') source = 'cache';
  }
  loading = false;
  if(RAW){
    D = normalize(RAW, c);
    const nm = D.full[c.tId]; const lg = `${D.head.name}${D.head.h1 ? ' · ' + D.head.h1 : ''}`;
    if(nm && (c.name !== nm || c.league !== lg)){ c.name = nm; c.league = lg; store.set('hb.teams', cfg); }
  } else D = null;
  if(D && (full || !SRAW || SRAW.key !== k || Date.now() - statsLoaded > 10 * 60e3)){ await loadStats(c); }
  S = D ? buildStats() : null;
  if(!D){ $('#main').innerHTML = `<div class="large"><div><h1>Keine Daten</h1><p>handball4all ist gerade nicht erreichbar.</p></div></div><button class="btn" data-refresh>Erneut versuchen</button>`; renderTabs(); }
  else render();
  schedule();
}
function schedule(){
  clearTimeout(timer);
  if(source === 'snapshot' || !D) return;
  const hot = D.games.some(liveish) || D.head.live;
  const soon = D.games.some(g => !g.played && g.hasTime && g.date - Date.now() > 0 && g.date - Date.now() < 30 * 60e3);
  timer = setTimeout(() => { if(document.visibilityState === 'visible') load(Date.now() - lastLoad > 30 * 60e3); else schedule(); }, hot ? 20e3 : soon ? 60e3 : 5 * 60e3);
}
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible' && source !== 'snapshot' && Date.now() - lastLoad > 60e3) load(false); });

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-share],[data-player],[data-sc],[data-scmine],[data-more],[data-goto-sc],[data-tab],[data-seg] button,[data-game],[data-team],[data-goto],[data-wk],[data-close],[data-switch],[data-color],[data-refresh],[data-remove],[data-pick],[data-follow],#addGo,#teamBtn');
  if(!t) return;
  if(t.matches('a[data-goto]')) e.preventDefault();
  if(t.id === 'teamBtn') return teamsSheet();
  if(t.id === 'addGo') return addFromUrl();
  const ds = t.dataset;
  if('share' in ds){ const u = location.origin + location.pathname; if(navigator.share){ navigator.share({title:'Handball', text:'Unsere Handball-App', url:u}).catch(() => {}); } else if(navigator.clipboard){ navigator.clipboard.writeText(u).then(() => toast('Link kopiert'), () => toast(u)); } else toast(u); return; }
  if(ds.player){ return playerSheet(ds.player); }
  if(ds.sc){ seg.sc = ds.sc; showAllScorers = false; render(); return; }
  if('scmine' in ds){ seg.scMine = !seg.scMine; render(); return; }
  if('more' in ds){ showAllScorers = true; render(); return; }
  if('gotoSc' in ds){ e.preventDefault(); tab = 'liga'; seg.liga = 'scorers'; store.set('hb.tab', tab); render(); window.scrollTo({top:0}); return; }
  if(ds.tab){ tab = ds.tab; store.set('hb.tab', tab); render(); window.scrollTo({top:0}); return; }
  if(t.parentElement && t.parentElement.dataset.seg){ seg[t.parentElement.dataset.seg] = ds.v; showAllScorers = false; render(); return; }
  if(ds.goto){ tab = ds.goto; store.set('hb.tab', tab); render(); window.scrollTo({top:0}); return; }
  if(ds.game) return gameSheet(ds.game);
  if(ds.team) return teamSheet(ds.team);
  if(ds.wk){ const weeks = [...new Set(D.games.map(g => weekKey(g.date)))].sort((a, b) => a - b); const i = weeks.indexOf(ligaWeek) + +ds.wk; if(weeks[i] != null){ ligaWeek = weeks[i]; render(); } return; }
  if('close' in ds) return closeSheet();
  if(ds.switch != null){ const i = +ds.switch; if(i !== active){ active = i; store.set('hb.active', active); D = null; RAW = null; SRAW = null; S = null; ligaWeek = null; applyColor(); render(); load(true); } closeSheet(); return; }
  if(ds.color){ cfg[active].color = ds.color; store.set('hb.teams', cfg); applyColor(); $('#sheet').querySelectorAll('[data-color]').forEach(b => b.classList.toggle('on', b === t)); render(); return; }
  if('refresh' in ds){ closeSheet(); toast('Aktualisiere…'); load(true).then(() => toast(source === 'live' ? 'Aktuell' : 'Keine Verbindung')); return; }
  if('remove' in ds){ cfg.splice(active, 1); active = 0; store.set('hb.teams', cfg); store.set('hb.active', 0); closeSheet(); D = null; RAW = null; applyColor(); render(); load(true); return; }
  if(ds.pick){ return addTeam({og:addState.og, lId:addState.lId, tId:ds.pick, name:ds.name, league:addState.league}); }
  if(ds.follow){ const c = cfg[active]; return addTeam({og:c.og, lId:c.lId, tId:ds.follow, name:D.full[ds.follow], league:c.league}); }
});
$('#scrim').addEventListener('click', closeSheet);
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeSheet(); if(e.key === 'Enter' && e.target.id === 'addUrl') addFromUrl(); });
window.addEventListener('scroll', () => $('#nav').classList.toggle('scrolled', window.scrollY > 40), {passive:true});
// swipe-down to close sheet
(() => { let y0 = null; const s = $('#sheet');
  s.addEventListener('touchstart', e => { y0 = s.scrollTop <= 0 ? e.touches[0].clientY : null; }, {passive:true});
  s.addEventListener('touchmove', e => { if(y0 == null) return; const dy = e.touches[0].clientY - y0; if(dy > 0){ s.style.transition = 'none'; s.style.transform = `translateY(${dy}px)`; } }, {passive:true});
  s.addEventListener('touchend', e => { if(y0 == null) return; const dy = (e.changedTouches[0].clientY - y0); s.style.transition = ''; s.style.transform = ''; if(dy > 110) closeSheet(); y0 = null; });
})();

applyColor(); render(); load(true);
setInterval(() => { if(D && tab === 'home') updateStatus(); }, 30e3);
</script>
</body>
</html>
