name: Statistik aktualisieren & veröffentlichen

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'          # stündlich
    - cron: '*/20 15-22 * * 0,6'  # Wochenende abends alle 20 Min. (UTC)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Spielberichte auslesen
        run: node scripts/update-stats.mjs
      - name: Ergebnis speichern
        run: |
          git config user.name "stats-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stats.json
          git diff --cached --quiet || (git commit -m "Statistik aktualisiert" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
